name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Linux execution sandbox
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap nodejs xdotool x11-utils
      - name: Allow Bubblewrap namespaces on disposable Ubuntu runner
        run: |
          # Ubuntu restricts unprivileged user namespaces by application profile.
          # Configure only bwrap on this ephemeral test runner. Do not disable
          # AppArmor globally or modify the application isolation flags.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo tee /etc/apparmor.d/chai-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile chai-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/chai-ci-bwrap
          fi
      - run: npm run check
      - name: Configure Chromium sandbox on disposable CI runner
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm run test:crash
      - run: xvfb-run -a npm run test:computer
      - run: xvfb-run -a npm run test:e2e
      - run: npm audit --omit=dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chai-ui-evidence
          path: .qa/*.png
