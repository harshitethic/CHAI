name: Release alpha
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Linux execution sandbox
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap nodejs xdotool x11-utils
      - name: Allow Bubblewrap namespaces on disposable Ubuntu runner
        run: |
          # Ubuntu restricts unprivileged user namespaces by application profile.
          # Configure only bwrap on this ephemeral test runner. Do not disable
          # AppArmor globally or modify the application isolation flags.
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo tee /etc/apparmor.d/chai-ci-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile chai-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/chai-ci-bwrap
          fi
      - run: npm run check
      - name: Configure test sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm run test:crash
      - run: xvfb-run -a npm run test:computer
      - run: xvfb-run -a npm run test:e2e
      - run: npm audit
      - run: npm run package
      - name: Verify packaged executable
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          CHAI_EXECUTABLE="$PWD/release/linux-unpacked/chai" xvfb-run -a npm run test:e2e
      - name: Publish tested alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum *.AppImage *.deb > SHA256SUMS
          version=$(node -p "require('../package.json').version")
          gh release create "v$version" *.AppImage *.deb SHA256SUMS --target "$GITHUB_SHA" --prerelease --title "CHAI $version — ChatGPT browser agents" --notes-file ../docs/RELEASE_BROWSER_ALPHA.md
